name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glyph-motion-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm check
          pnpm test
          pnpm build

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and activate release
        run: |
          DEPLOY_TARGET="${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}"
          RELEASE_PATH="${{ vars.DEPLOY_PATH }}/releases/${GITHUB_SHA}"
          ssh "$DEPLOY_TARGET" "mkdir -p '$RELEASE_PATH'"
          rsync -az --delete build/ "$DEPLOY_TARGET:$RELEASE_PATH/"
          ssh "$DEPLOY_TARGET" "set -e; cd '${{ vars.DEPLOY_PATH }}'; ln -sfn 'releases/${GITHUB_SHA}' current.next; mv -Tf current.next current"

      - name: Verify public deployment
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "https://${{ vars.DEPLOY_DOMAIN }}/" | grep -q 'Glyph Motion Studio'; then
              echo "healthy: live studio returned the production document"
              exit 0
            fi
            sleep 5
          done
          echo "::error::health gate failed for https://${{ vars.DEPLOY_DOMAIN }}"
          exit 1
