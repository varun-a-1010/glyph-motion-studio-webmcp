server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name glyph-motion.slate-app.online;

	root /var/www/glyph-motion-studio-webmcp/current;
	index index.html;

	ssl_certificate /etc/letsencrypt/live/glyph-motion.slate-app.online/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/glyph-motion.slate-app.online/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	gzip on;
	gzip_static on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_comp_level 6;
	gzip_proxied any;
	gzip_types application/javascript application/json image/svg+xml text/css;

	location ~ (^|/)\. {
		return 404;
	}

	location ^~ /_app/immutable/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}

	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name glyph-motion.slate-app.online;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}
